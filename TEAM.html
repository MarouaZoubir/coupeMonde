<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FanZone - Prototype</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: #f4f6f8;
      color: #333;
    }
    
    .app {
      max-width: 414px;
      height: 736px;
      margin: 20px auto;
      background-color: white;
      border-radius: 30px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    
    .screen {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      padding: 20px;
      transition: transform 0.3s ease;
      background-color: white;
      display: flex;
      flex-direction: column;
    }
    
    .screen:not(.active) {
      transform: translateX(100%);
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 15px;
    }
    
    .logo {
      display: flex;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      color: #1E88E5;
    }
    
    .logo-icon {
      width: 30px;
      height: 30px;
      background-color: #1E88E5;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      font-size: 16px;
    }
    
    .btn {
      background-color: #1E88E5;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
      display: inline-block;
      margin-top: 10px;
      box-shadow: 0 4px 8px rgba(30, 136, 229, 0.2);
      transition: all 0.3s ease;
    }
    
    .btn:hover {
      background-color: #1976D2;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(30, 136, 229, 0.3);
    }
    
    .btn-secondary {
      background-color: #673AB7;
    }
    
    .btn-secondary:hover {
      background-color: #5E35B1;
    }
    
    .btn-outline {
      background-color: transparent;
      border: 2px solid #1E88E5;
      color: #1E88E5;
    }
    
    .input-group {
      margin-bottom: 15px;
    }
    
    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #555;
    }
    
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
    }
    
    .map-container {
      background-color: #e9f5fe;
      height: 280px;
      border-radius: 15px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
    }
    
    .map-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .fan-cluster {
      width: 50px;
      height: 50px;
      background-color: rgba(255, 87, 34, 0.8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      position: absolute;
      cursor: pointer;
      transition: transform 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    .fan-cluster:hover {
      transform: scale(1.1);
    }
    
    .cluster-1 {
      top: 30%;
      left: 20%;
      background-color: rgba(255, 87, 34, 0.8);
    }
    
    .cluster-2 {
      top: 40%;
      left: 60%;
      background-color: rgba(76, 175, 80, 0.8);
    }
    
    .cluster-3 {
      top: 65%;
      right: 25%;
      background-color: rgba(33, 150, 243, 0.8);
    }
    
    .menu-bar {
      background-color: white;
      display: flex;
      justify-content: space-around;
      padding: 15px 0;
      border-top: 1px solid #f0f0f0;
      margin-top: auto;
    }
    
    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #757575;
      font-size: 12px;
      cursor: pointer;
    }
    
    .menu-item.active {
      color: #1E88E5;
    }
    
    .menu-icon {
      font-size: 20px;
      margin-bottom: 4px;
    }
    
    .vr-container {
      background-color: #0D101C;
      height: 300px;
      border-radius: 15px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 15px;
    }
    
    .vr-avatar {
      width: 40px;
      height: 40px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      position: absolute;
    }
    
    .avatar-1 { top: 20%; left: 25%; }
    .avatar-2 { top: 35%; left: 45%; }
    .avatar-3 { top: 30%; right: 20%; }
    .avatar-4 { bottom: 35%; left: 30%; }
    .avatar-5 { bottom: 25%; right: 35%; }
    
    .vr-info {
      text-align: center;
      margin-bottom: 10px;
    }
    
    .vr-info h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }
    
    .vr-info p {
      font-size: 13px;
      color: #aaa;
    }
    
    .vr-controls {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
    }
    
    .control-dot {
      width: 30px;
      height: 30px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
    }
    
    .tab-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background-color: #f5f5f5;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }
    
    .tab.active {
      background-color: #1E88E5;
      color: white;
      font-weight: bold;
    }
    
    .event-card {
      background-color: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid #eee;
    }
    
    .event-date {
      color: #888;
      font-size: 12px;
      margin-bottom: 8px;
    }
    
    .event-teams {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }
    
    .team {
      display: flex;
      align-items: center;
      font-weight: bold;
    }
    
    .vs {
      margin: 0 15px;
      color: #888;
    }
    
    .event-action {
      position: absolute;
      right: 15px;
      bottom: 15px;
      width: 30px;
      height: 30px;
      background-color: #4CAF50;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }
    
    .welcome-logo {
      width: 100px;
      height: 100px;
      background-color: #1E88E5;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
    }
    
    .welcome-title {
      font-size: 28px;
      margin-bottom: 10px;
      color: #333;
    }
    
    .welcome-subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
    }
    
    .social-login {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }
    
    .social-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: white;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }
    
    .team-selection {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    
    .team-flag {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      font-size: 24px;
      background-color: #f5f5f5;
    }
    
    .team-flag.selected {
      border-color: #1E88E5;
    }
    
    .route-info {
      background-color: #f5f5f5;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
    }
    
    .route-info h3 {
      margin-bottom: 10px;
    }
    
    .route-details {
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
    }
    
    .route-warning {
      font-size: 14px;
      color: #F44336;
    }
    
    .mode-toggle {
      display: flex;
      margin-top: 15px;
      margin-bottom: 15px;
    }
    
    .mode-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }
    
    .mode-btn.active {
      background-color: #673AB7;
      color: white;
      font-weight: bold;
    }
    
    .mode-btn:not(.active) {
      background-color: white;
      border: 1px solid #673AB7;
      color: #673AB7;
.team-selection {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .team-card {
    width: 80px;
    height: 80px;
    border-radius: 15px;
    background-color: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .team-card:hover {
    background-color: #1E88E5;
    color: white;
    transform: scale(1.05);
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    padding: 10px 0;
    border-top: 1px solid #eee;
    margin-top: auto;
  }
</style>
</head>
<body>
<div class="app">
  <div class="screen active">
    <header>
      <div class="logo">
        <div class="logo-icon">FZ</div>
        FanZone
      </div>
      <button class="btn btn-outline">Connexion</button>
    </header>

    <div class="welcome-screen">
      <div class="welcome-logo">FZ</div>
      <h1 class="welcome-title">Bienvenue sur FanZone</h1>
      <p class="welcome-subtitle">Rejoignez votre communauté de fans préférée.</p>
      <button class="btn">Commencer</button>

      <div class="social-login">
        <div class="social-btn">G</div>
        <div class="social-btn">F</div>
        <div class="social-btn">T</div>
      </div>
    </div>

    <div class="team-selection">
      <div class="team-card">Équipe A</div>
      <div class="team-card">Équipe B</div>
      <div class="team-card">Équipe C</div>
      <div class="team-card">Équipe D</div>
      <div class="team-card">Équipe E</div>
      <div class="team-card">Équipe F</div>
    </div>

    <footer>
      &copy; 2025 FanZone. Tous droits réservés.
    </footer>
  </div>
</div>
</body>
</html>
